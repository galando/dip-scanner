name: Register Bot Users
on:
  workflow_dispatch:
jobs:
  register:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Register new users
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          PYTHONPATH: .
        run: python src/register.py
      - name: Commit updated users file
        run: |
          git config user.name "dip-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/users.json || true
          git commit -m "update registered users" || true
          git push || true
