name: Daily Dip Scan
on:
  schedule:
    # 20:30 UTC = 22:30 Amsterdam summer (CEST/UTC+2), after US close (16:00 ET)
    - cron: '30 20 * * 1-5'   # weekdays only
  workflow_dispatch:           # manual run for testing
  push:
    branches: [main]           # run on every merge to main
jobs:
  scan:
    runs-on: ubuntu-latest
    # Needed so github-actions[bot] can push the updated state.json back.
    # Without this the token is read-only and the push step 403s.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONPATH: .
        run: python src/scanner.py
      - name: Commit state file
        run: |
          git config user.name "dip-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json || true
          git add data/sp500_cache.json || true
          git commit -m "update dedup state" || true
          git push || true
